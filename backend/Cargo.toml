[package]
name = "casp-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.3.0", features = ["contract", "provider-http", "reqwest", "sol-types", "signer-local"] }
async-trait = "0.1.89"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
