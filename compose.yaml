name: rusd-casp

services:
  casp-backend:
    build: ./backend
    environment:
      TOKEN_ADDRESS: ${TOKEN_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      CASP_CORPORATE_ADDRESS: 0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      CASP_DEPOSIT_ROUTER_ADDRESS: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      CASP_CORPORATE_PRIVATE_KEY: 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      CASP_HOT_ADDRESS: 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      CASP_HOT_PRIVATE_KEY: 0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
      CASP_COLD_ADDRESS: 0x90F79bf6EB2c4f870365E785982E1f101E93b906
      CASP_COLD_PRIVATE_KEY: 0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6
      RPC_URL: ${RPC_URL:-http://host.docker.internal:8545}
      ISSUER_URL: ${ISSUER_URL:-http://host.docker.internal:3000}
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://127.0.0.1:5173}
      MOCK_BANK_URL: ${MOCK_BANK_URL:-http://host.docker.internal:3100}
      CASP_HTTP_ADDRESS: 0.0.0.0:3200
      CASP_DATABASE_PATH: /app/data/casp.sqlite
      SEED_CASP_REPORTING_DEMO_ON_STARTUP: "true"
      CHAIN_ID: "31337"
      RUST_LOG: info
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["casp_data:/app/data"]
    ports: ["3200:3200"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3200/health"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 10s

  casp-frontend:
    build: ./frontend
    depends_on:
      casp-backend: { condition: service_healthy }
    environment:
      VITE_DEV_PROXY_TARGET: http://casp-backend:3200
    ports: ["5174:5174"]

volumes:
  casp_data:

